
spring.application.name=dream-shops

# Render port
server.port=${PORT:8080}

# TiDB Cloud database
spring.datasource.url=jdbc:mysql://${TIDB_HOST}:${TIDB_PORT}/${TIDB_DATABASE}?sslMode=VERIFY_IDENTITY
spring.datasource.username=${TIDB_USER}
spring.datasource.password=${TIDB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

# File upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# API configuration
api.prefix=/api/v1

# JWT configuration
auth.token.expirationInMils=${JWT_EXPIRATION:3600000}
auth.token.jwtSecret=${JWT_SECRET}
